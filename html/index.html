<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingresar · Planning de Mantenimiento · Romero Panificados</title>
<link rel="icon" href="https://www.romeropanificados.com.ar/wp-content/uploads/2026/07/cropped-fabicon-romero-1-270x270.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="login-page">
<main class="login-shell">
  <section class="login-card">
    <div class="login-logo">
      <img src="https://www.romeropanificados.com.ar/wp-content/uploads/2023/01/Recurso-8.png" alt="Romero Panificados">
      <span>TI 2026</span>
    </div>

    <div class="login-head">
      <h1>Planning de Mantenimiento</h1>
      <p>Ingresá con tu usuario y contraseña</p>
    </div>

    <form id="loginForm" autocomplete="on" novalidate>
      <label for="username">Usuario
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Tu usuario" autofocus required>
      </label>

      <label for="password">Contraseña
        <div class="pw-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>
          <button type="button" id="pwToggle" class="pw-toggle" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.5 10.5 0 0 1 12 5c6.5 0 10.5 7 10.5 7a17.6 17.6 0 0 1-3.2 3.9M6.6 6.6A17.4 17.4 0 0 0 1.5 12S5.5 19 12 19c1.7 0 3.2-.4 4.5-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
      </label>

      <div id="loginError" class="login-error hidden" role="alert" aria-live="assertive"></div>

      <button class="primary login-btn" type="submit">INGRESAR</button>
    </form>

    <p class="login-foot">Romero Panificados · Acceso restringido</p>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
